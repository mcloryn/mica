<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MICA</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-status="ready">
<header id="navbar">
  <div id="brand">
    <span id="logo_text" class="logo-placeholder">MICA</span>
    <img id="logo_img" alt="Logo" hidden>
    <span id="app_title"></span>
    <span id="trial_badge" class="trial-badge" hidden></span>
  </div>
  <div id="indicators">
    <span id="camera_indicator" class="indicator"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3l2-2h8l2 2h3v12H3z"/><circle cx="12" cy="13" r="3.5"/></svg><span class="label"></span></span>
    <span id="mic_indicator" class="indicator"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span class="label"></span></span>
  </div>
</header>

<main id="layout">
  <section id="left" class="panel" aria-labelledby="camera_title">
    <h2 id="camera_title" class="panel-head"></h2>
    <div id="preview_frame">
      <img id="preview_img" alt="Pratinjau kamera" hidden>
      <div id="preview_empty"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3l2-2h8l2 2h3v12H3z"/><circle cx="12" cy="13" r="3.5"/></svg></div>
    </div>
    <div id="color_info">
      <span id="swatch_big" class="swatch-big" hidden></span>
      <p id="color_text"></p>
    </div>
    <p id="camera_info" class="small"></p>
    <details id="debug_dock" hidden>
      <summary>Debug (dev)</summary>
      <pre id="debug_panel"></pre>
    </details>
  </section>

  <section id="right" class="panel" aria-label="Percakapan">
    <div id="conversation" aria-live="polite">
      <div id="welcome">
        <h1 id="welcome_title"></h1>
        <p id="welcome_greeting"></p>
        <p id="topics_hint" class="small"></p>
        <div id="topic_grid" role="group" aria-label="Topik"></div>
      </div>
      <div id="greeting_msg" class="msg mica" hidden>
        <div class="who">MICA</div>
        <div class="bubble"><p id="greeting"></p></div>
      </div>
      <div id="messages"></div>
    </div>
    <div id="chips" role="group" aria-label="Topik" hidden></div>
    <p id="status_line" role="status" aria-live="polite"><span id="status_icon"></span><span id="status_text"></span></p>
    <div id="transcript_row" hidden>
      <label id="transcript_label" for="transcript_edit"></label>
      <input id="transcript_edit" type="text">
      <button id="resend_button" type="button" class="btn"></button>
    </div>
    <div id="bottom_bar">
      <button id="talk_button" type="button" class="btn btn-primary btn-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span id="talk_label"></span>
      </button>
      <input id="input" type="text" autocomplete="off">
      <button id="send_button" type="button" class="btn"></button>
      <button id="stop_button" type="button" class="btn" hidden></button>
    </div>
  </section>
</main>
<footer id="footer"><p id="notice"></p></footer>

<!-- ikon garis lokal, satu gaya (stroke 1,75, tanpa isi) -->
<template id="icon-info"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></template>
<template id="icon-doc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg></template>
<template id="icon-listening"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg></template>
<template id="icon-thinking"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5 20 20"/></svg></template>
<template id="icon-speaking"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg></template>
<template id="icon-ready"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></template>
<template id="icon-topic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg></template>
<template id="icon-topic-program-studi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6c3-1 6-1 9 1 3-2 6-2 9-1v13c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 7v13"/></svg></template>
<template id="icon-topic-biaya"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg></template>
<template id="icon-topic-beasiswa"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="5"/><path d="M9 13.5 8 21l4-2 4 2-1-7.5"/></svg></template>
<template id="icon-topic-pendaftaran"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/></svg></template>
<template id="icon-topic-fasilitas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V8l8-4 8 4v13M9 21v-6h6v6M8 11h.01M16 11h.01"/></svg></template>
<template id="icon-topic-lokasi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></template>
<script src="/static/app.js"></script>
</body>
</html>
