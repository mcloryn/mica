[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mica"
version = "0.1.0"
description = "MICA: kiosk informasi PMB Universitas Mikroskil"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "pypdf",
    "python-docx",
    "numpy",
    "rank-bm25",
    "sentence-transformers",
    "httpx",
    # M-07 vision (ADR-12, ADR-15); torch versi CPU
    "ultralytics>=8.4.63,<8.5",
    "opencv-python",
    "lap>=0.5.12",  # ByteTrack; dipasang eksplisit supaya Ultralytics tidak memasang saat runtime
    # M-08 TTS (ADR-11): piper-tts GPL-3.0-or-later, num2words LGPL, sounddevice MIT
    "piper-tts==1.8.0",
    "num2words==0.5.14",
    "sounddevice==0.5.6",
    # M-08 STT (ADR-09, ADR-10) dan WER (E-05): MIT, MIT, Apache-2.0
    "faster-whisper==1.2.1",
    "pysilero-vad==3.4.0",
    "jiwer==4.0.0",
    # M-10 UI (ADR-19): LGPL-3.0-only OR GPL-2.0-only; hanya QtCore/QtGui/QtWidgets (+QtTest
    # untuk pytest-qt), jadi cukup paket Essentials tanpa Addons/WebEngine/Pdf
    "PySide6-Essentials==6.12.0",
    # UI web (ADR-19, ui.backend: web): HTTP + WebSocket satu port. Flask BSD-3-Clause,
    # flask-sock MIT (menarik Werkzeug BSD-3-Clause, simple-websocket MIT, wsproto MIT)
    "Flask==3.1.3",
    "flask-sock==0.7.0",
    # runtime: EdgeBrowser.close menutup pohon proses Edge (juga dipakai scripts/ui_bench.py);
    # BSD-3-Clause
    "psutil==7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt==4.5.0",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mica.webui" = ["static/*"]  # UI web (ui.backend: web); font sistem, tanpa file font

[tool.pytest.ini_options]
testpaths = ["tests"]
# akar repo di sys.path supaya factory palsu "tests.fakes:..." bisa diimpor proses anak (spawn)
pythonpath = ["."]
markers = ["slow: memakai bobot model asli di models/ (dilewati bila belum diunduh)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
# SDD adalah ekspor dokumen; blok kodenya tidak diformat ulang
exclude = ["docs/**"]
