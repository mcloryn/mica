[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mica"
version = "0.1.0"
description = "MICA: kiosk informasi PMB Universitas Mikroskil"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "pypdf",
    "python-docx",
    "numpy",
    "rank-bm25",
    "sentence-transformers",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
