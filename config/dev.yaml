app:
  mode: dev                   # kiosk | dev; Gemini hanya boleh di dev
  version: 0.1.0
kb:
  active_id: dev-2026-10-15-v2    # F-17
  chunker: structure_then_fixed     # ADR-03; alternatif: fixed
  chunk_tokens: 400                 # E-01; nilai awal dev, dikalibrasi di E-01
  overlap_tokens: 50                # E-01; nilai awal dev, dikalibrasi di E-01
  embedder:
    model: BAAI/bge-m3              # ADR-02
    revision: 9a0624b896d81da7492a910ffa53731274b6cf3d  # N-14; PR #130 SFconvertbot, model.safetensors
rag:
  retriever: hybrid                 # ADR-01; bm25 | dense | hybrid
  top_k: 5                          # ADR-16, diuji ulang di E-01
  rrf_k: 60                         # Cormack dkk. 2009, nilai awal; E-01
  candidates_per_retriever: 20      # nilai awal dev; E-01
  reranker:
    enabled: false                  # ADR-01; nyala hanya bila lolos aturan E-01
    model: BAAI/bge-reranker-v2-m3
    revision: null                  # N-14; hash commit lengkap, wajib di kiosk
  gate:
    threshold: 0.50                 # ADR-06; provisional, sweep prompt v2 (20b+120b), seri null/.45/.48/.50 -> tertinggi
  fact_check:
    enabled: true                   # ADR-06 lapis 3
  followup_mode: concat             # ADR-05; concat | llm_rewrite (E-02)
  history_turns: 1
  prompt_variant: paraphrase        # ADR-07; paraphrase | plain (E-03)
llm:
  chain:                            # ADR-08; urutan coba
    - groq:openai/gpt-oss-120b      # ID dicek di dokumentasi Groq 16 Okt 2026
    - groq:openai/gpt-oss-20b
  timeout_s: 10                     # provisional dev, E-04
  temperature: 0.2                  # provisional dev, E-04
  reasoning_effort: low             # low | medium | high; provisional dev, E-04
  prompt_variants: {}               # docs/PROMPT-V4.md; {} = semua rag.prompt_variant. Rencana bila anotasi 120b
                                    # halusinasi 0/28: {groq:openai/gpt-oss-120b: v4, groq:openai/gpt-oss-20b: paraphrase}
audio:
  input_mode: push_to_talk          # keputusan desain pengguna 18 Okt 2026 (Langkah 42); vad = mode lama untuk perbandingan
  stt:
    backend: faster_whisper         # ADR-09; faster_whisper | groq_whisper (E-05)
    model: small
    compute_type: int8
    threads: null                   # E-09
    no_speech_threshold: null       # E-05; semua segmen no_speech_prob >= nilai -> tersaring
    groq_model: whisper-large-v3-turbo   # dev; dari console.groq.com/docs/speech-to-text (dicek 17 Okt 2026); E-05 memilih
  vad:
    threshold: null                 # E-05
    min_silence_ms: null            # E-05
    min_speech_ms: null             # E-05; ucapan lebih pendek dibuang sebelum STT
  max_utterance_s: null             # E-05
  tts:
    voice: id_ID-news_tts-medium    # ADR-11 provisional
    length_scale: null              # null = bawaan .onnx.json suara
    threads: 1                      # dipilih CPU-THREADS.md, laptop dev (bench 20261021-131908 tahap 1); null = bawaan onnxruntime
vision:
  model: yolo26n-pose               # ADR-12; yolo26n | yolo26n-pose | yolo11n (E-07)
  tracker: bytetrack.yaml           # ADR-15
  region: keypoint_torso            # ADR-13; keypoint_torso | box_upper (E-08)
  box_upper:                        # area dada BoxUpperRegion (juga cadangan keypoint), fraksi box (E-08)
    top: null                       # E-08
    bottom: null                    # E-08
    side: null                      # E-08
  keypoint_torso:                   # area dada dari keypoint COCO 5, 6, 11, 12 (E-08)
    min_kp_conf: null               # E-08
    shrink: null                    # E-08
    torso_aspect: null              # E-08; bila pinggul tak terlihat
  color:
    method: lut_vote                # ADR-14; lut_vote | lut_mean (E-08, amandemen 1); PROVISIONAL
    min_majority: null              # E-08
  dwell_s: null                     # E-07, syarat sapaan <= 3 detik (N-06)
  leave_s: null                     # E-07
  presence_signal: shoulder_width   # E-07; box_height | shoulder_width (butuh -pose)
  min_box_height_ratio: null        # E-07; dipakai bila presence_signal box_height
  min_shoulder_ratio: null          # E-07; dipakai bila presence_signal shoulder_width
  conf: 0.1                         # PROVISIONAL, ditetapkan di E-07; nilai dev = bawaan model.track Ultralytics 8.4
  imgsz: 640                        # PROVISIONAL, ditetapkan di E-07; nilai dev = bawaan Ultralytics 8.4
  fps_idle: 5                       # ADR-20
  fps_busy: null                    # E-09
  pause_during_tts: true            # Langkah 51 (keputusan pengguna 21 Okt 2026): YOLO dijeda saat Piper menyusun suara
  threads: 7                        # dipilih CPU-THREADS.md, laptop dev (bench 20261021-133951 tahap 2 ulang); null = 8 (Ultralytics)
session:
  idle_reset_s: null                # E-09
  regreet_cooldown_s: null          # E-07
ui:
  backend: web                      # ADR-19: web | pyside6; web dipilih pemilik proyek 17 Okt 2026, pyside6 cadangan beku (docs/UI-WEB.md)
  fullscreen: true
  font_scale: 1.0
  topics: [Program Studi, Biaya, Beasiswa, Pendaftaran, Fasilitas, Lokasi]   # F-14; kartu UI web (Langkah 37), kartu hanya mengisi kotak pertanyaan
  logo_path: null                   # file logo lokal; null = placeholder teks "MICA" sampai logo resmi tersedia
  camera_preview: debug             # off | public | debug (debug ditolak di kiosk); Langkah 37
  preview_pixel_block: 16           # NILAI COBA DESAIN (bukan hasil eksperimen): blok pixelate px pada gambar lebar 320
  preview_fps: 10                   # keputusan desain pengguna 18 Okt 2026: pratinjau minimal 10 fps; tidak menambah inferensi YOLO
  suggestions: {}                   # F-14; topik -> daftar saran pertanyaan, diisi pengembang
logging:
  dir: logs/
eval:
  judge:
    enabled: false                  # ADR-18; hanya pelengkap penilaian manusia
